server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: pagos-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pagos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:staysync_rabbit}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:staysync_vhost}

stripe:
  # Configurar en entorno: export STRIPE_SECRET_KEY=sk_test_...
  # Obtener en: dashboard.stripe.com → Developers → API keys → Secret key
  secret-key: ${STRIPE_SECRET_KEY}
  back-urls:
    success: ${STRIPE_SUCCESS_URL:http://localhost:3000/huesped/pago-exitoso}
    cancel: ${STRIPE_CANCEL_URL:http://localhost:3000/huesped/pago-fallido}

services:
  reservas:
    url: ${RESERVAS_SERVICE_URL:http://localhost:8083}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      reservasValidacionCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

logging:
  level:
    com.staysync: INFO
